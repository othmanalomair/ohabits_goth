  <circle cx="10.5" cy="13.5" r="0.4" fill="#A0AEC0"/>
  <circle cx="12" cy="13.5" r="0.4" fill="#A0AEC0"/>
  <circle cx="13.5" cy="13.5" r="0.4" fill="#A0AEC0"/>
