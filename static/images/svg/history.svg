<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clock face circle -->
  <circle cx="10" cy="10" r="8" stroke="#4A5568" stroke-width="1.5" fill="none"/>
  
  <!-- Clock hands -->
  <!-- Hour hand (shorter, pointing to 9) -->
  <line x1="10" y1="10" x2="7" y2="10" stroke="#2D3748" stroke-width="2" stroke-linecap="round"/>
  <!-- Minute hand (longer, pointing to 12) -->
  <line x1="10" y1="10" x2="10" y2="5" stroke="#2D3748" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Clock center dot -->
  <circle cx="10" cy="10" r="1" fill="#2D3748"/>
  
  <!-- Clock numbers/markers -->
  <circle cx="10" cy="4" r="0.5" fill="#718096"/>
  <circle cx="14" cy="7" r="0.5" fill="#718096"/>
  <circle cx="16" cy="10" r="0.5" fill="#718096"/>
  <circle cx="14" cy="13" r="0.5" fill="#718096"/>
  <circle cx="10" cy="16" r="0.5" fill="#718096"/>
  <circle cx="6" cy="13" r="0.5" fill="#718096"/>
  <circle cx="4" cy="10" r="0.5" fill="#718096"/>
  <circle cx="6" cy="7" r="0.5" fill="#718096"/>
  
  <!-- History/rotation arrow -->
  <path d="M3 10 C3 6 6 3 10 3 C11.5 3 13 3.5 14 4.5" stroke="#667eea" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M12.5 3.5 L14 4.5 L13 6" stroke="#667eea" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>