<div class="project-card" id="project-{{ .ID }}">
    <div class="project-content">
        <div class="project-header">
            <h3>{{ .Name }}</h3>
            <div class="project-actions">
                <button
                    hx-get="/projects/{{ .ID }}/edit-form"
                    hx-target="#project-{{ .ID }}"
                    hx-swap="outerHTML"
                    class="edit-btn"
                >
                    <img src="/static/images/svg/edit.svg" alt="Edit" />
                </button>
                <button
                    hx-post="/projects/{{ .ID }}/delete"
                    hx-target="#projects-list"
                    hx-swap="innerHTML"
                    hx-confirm="Are you sure you want to delete this project?"
                    class="delete-btn"
                >
                    <img src="/static/images/svg/trash-red.svg" alt="Delete" />
                </button>
            </div>
        </div>
        {{ if .Description }}
        <p class="project-description">{{ .Description }}</p>
        {{ end }}
        <div class="project-stats">
            <span>Main: {{ .MainTasks }}</span>
            <span>Sub: {{ .SubTasks }}</span>
            <span>Done: {{ .CompletedTasks }}</span>
        </div>
    </div>
    
    <div class="project-view">
        <button
            hx-get="/projects/{{ .ID }}"
            hx-target="main"
            hx-swap="innerHTML"
            class="view-button"
            title="View Tasks"
        >
            View
        </button>
    </div>
</div>
