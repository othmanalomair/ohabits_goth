<div class="project-card" id="project-{{ .ID }}">
    <div class="project-content">
        <form
            hx-post="/projects/{{ .ID }}/edit"
            hx-target="#project-{{ .ID }}"
            hx-swap="outerHTML"
            class="project-edit-form"
        >
            <div class="edit-field">
                <label for="name">Project Name</label>
                <input type="text" name="name" value="{{ .Name }}" required />
            </div>
            <div class="edit-field">
                <label for="description">Description</label>
                <textarea 
                    name="description" 
                    placeholder="Description (optional)"
                    rows="3"
                >{{ if .Description }}{{ .Description }}{{ end }}</textarea>
            </div>
            <div class="edit-actions">
                <button type="submit" class="save-btn">
                    <img src="/static/images/svg/check-green.svg" alt="Save" />
                    Save
                </button>
                <button
                    type="button"
                    hx-get="/projects/{{ .ID }}/cancel"
                    hx-target="#project-{{ .ID }}"
                    hx-swap="outerHTML"
                    class="cancel-btn"
                >
                    <img src="/static/images/svg/x-red.svg" alt="Cancel" />
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>

<style>
.project-edit-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: 100%;
}

.edit-field {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.edit-field label {
    font-size: 0.9rem;
    font-weight: 500;
    color: #4a5568;
}

.edit-field input,
.edit-field textarea {
    padding: 0.75rem;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.8);
    font-family: inherit;
    font-size: 0.9rem;
    color: #2d3748;
    transition: border-color 0.2s ease;
    resize: vertical;
}

.edit-field input:focus,
.edit-field textarea:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.edit-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    margin-top: 1rem;
    width: 100%;
}

.save-btn,
.cancel-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.875rem 1.5rem;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    flex: 1;
    min-height: 48px;
}

.save-btn {
    background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
    color: white;
    box-shadow: 0 2px 8px rgba(72, 187, 120, 0.2);
}

.save-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(72, 187, 120, 0.3);
}

.cancel-btn {
    background: rgba(239, 68, 68, 0.1);
    color: #e53e3e;
    border: 2px solid rgba(239, 68, 68, 0.2);
    box-shadow: 0 2px 8px rgba(239, 68, 68, 0.1);
}

.cancel-btn:hover {
    background: rgba(239, 68, 68, 0.15);
    border-color: rgba(239, 68, 68, 0.3);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(239, 68, 68, 0.2);
}

.save-btn img,
.cancel-btn img {
    width: 16px;
    height: 16px;
}

/* Mobile: Keep buttons on same line and make them nice */
@media (max-width: 767px) {
    .edit-actions {
        display: flex;
        flex-direction: row; /* Force horizontal layout */
        gap: 0.5rem;
        justify-content: center;
        width: 100%;
        padding: 0 0.5rem; /* Add some padding to prevent edge touching */
    }
    
    .save-btn,
    .cancel-btn {
        flex: 1; /* Each button takes equal space */
        padding: 0.75rem 0.5rem;
        font-size: 0.85rem;
        font-weight: 600;
        min-height: 44px;
        max-width: none;
        min-width: 0; /* Allow buttons to shrink if needed */
    }
    
    .save-btn img,
    .cancel-btn img {
        width: 14px;
        height: 14px;
    }
}

/* For very narrow screens like 360px - keep side by side but more compact */
@media (max-width: 400px) {
    .edit-actions {
        gap: 0.375rem;
        padding: 0 0.25rem;
    }
    
    .save-btn,
    .cancel-btn {
        padding: 0.625rem 0.375rem;
        font-size: 0.8rem;
        min-height: 40px;
    }
    
    .save-btn img,
    .cancel-btn img {
        width: 12px;
        height: 12px;
    }
}

/* Only stack on extremely small screens */
@media (max-width: 280px) {
    .edit-actions {
        flex-direction: column;
        gap: 0.5rem;
    }
    
    .save-btn,
    .cancel-btn {
        flex: none;
        width: 100%;
        padding: 0.75rem;
    }
}
</style>
